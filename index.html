<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15 · Registro</title>
  <link rel="stylesheet" href="src/css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/locale/es.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/plugin/customParseFormat.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/plugin/duration.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/plugin/utc.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/plugin/timezone.js"></script>
  <script defer src="src/js/index.js"></script>
</head>

<body>
  <main>
    <h1>Crear cuenta</h1>
    <p class="intro">Registra tu cuenta de jugador.</p>
    <form id="register-form" novalidate>
      <label for="username">Nombre de usuario</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"
        aria-describedby="username-error username-status">
      <small id="username-error" class="error" aria-live="polite"></small>
      <small id="username-status" role="status"></small>
      <label for="email">Email</label>
      <input id="email" type="text" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false"
        aria-describedby="email-error">
      <small id="email-error" class="error" aria-live="polite"></small>
      <label for="birthdate">Fecha de nacimiento</label>
      <input id="birthdate" type="date" autocomplete="bday" aria-describedby="birthdate-error">
      <small id="birthdate-error" class="error" aria-live="polite"></small>
      <label for="password">Contraseña</label>
      <div class="password-field">
        <input id="password" type="password" autocomplete="new-password" aria-describedby="password-error">
        <button class="toggle-password" type="button" aria-label="Mostrar contraseña" aria-controls="password"
          aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
            <circle cx="12" cy="12" r="3" />
            <path class="eye-slash" d="m3 3 18 18" />
          </svg>
        </button>
      </div>
      <small id="password-error" class="error" aria-live="polite"></small>
      <label for="confirm-password">Confirmar contraseña</label>
      <div class="password-field">
        <input id="confirm-password" type="password" autocomplete="new-password"
          aria-describedby="confirm-password-error">
        <button class="toggle-password" type="button" aria-label="Mostrar confirmación de contraseña"
          aria-controls="confirm-password" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
            <circle cx="12" cy="12" r="3" />
            <path class="eye-slash" d="m3 3 18 18" />
          </svg>
        </button>
      </div>
      <small id="confirm-password-error" class="error" aria-live="polite"></small>
      <button class="submit" type="submit">Crear cuenta</button>
      <p id="register-message" role="status"></p>
    </form>
    <details>
      <summary>Datos de prueba</summary>
      <p>Nombres ocupados: <code>player_one</code>, <code>pixelmaster</code>, <code>dragonborn</code> y
        <code>lunagamer</code>.
      </p>
      <p>Simulación local. Utiliza datos ficticios.</p>
    </details>
  </main>
</body>

</html>
