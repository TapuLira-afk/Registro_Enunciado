<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>14 · Login</title>
  <link rel="stylesheet" href="src/css/style.css">
  <script src="src/js/index.js" defer></script>
</head>

<body>
  <main>
    <h1>Iniciar sesión</h1>
    <p class="intro">Accede a tu cuenta de jugador.</p>
    <form id="login-form" novalidate>
      <label for="identity">Usuario o email</label>
      <input id="identity" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"
        aria-describedby="identity-error">
      <small id="identity-error" class="error" aria-live="polite"></small>
      <label for="password">Contraseña</label>
      <div class="password-field">
        <input id="password" type="password" autocomplete="current-password" aria-describedby="password-error">
        <button id="toggle-password" type="button" aria-label="Mostrar contraseña" aria-controls="password"
          aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
            <circle cx="12" cy="12" r="3" />
            <path class="eye-slash" d="m3 3 18 18" />
          </svg>
        </button>
      </div>
      <small id="password-error" class="error" aria-live="polite"></small>
      <button class="submit" type="submit">Entrar</button>
      <p id="login-message" role="status"></p>
    </form>
    <details>
      <summary>Cuenta de prueba</summary>
      <p>Usuario: <code>player_one</code><br>Email: <code>player@example.com</code><br>Contraseña:
        <code>Juego2026!</code>
      </p>
      <p>Simulación local para practicar JavaScript.</p>
    </details>
  </main>
</body>

</html>
